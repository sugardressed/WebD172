<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEBD 172 Homework 04</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Movies Portal</h1>
  <p>Search for your favorite movies!</p></header>

  <main>
    <section>
      <h2>Available Movies</h2>
      <button id="loadCoursesBtn">Load Movies</button>
      <div id="courses"></div>
    </section>
    
    <section>
      <h2>Find a Movie by ID</h2>
      <form id="courseForm">
        <label for="courseId">Movie ID:</label>
        <input type="number" id="courseId"  min="1" required>
        <button type="submit">Find Movie</button>
      </form>
      <div id="courseResult"></div>
    </section>

    <section>
      <h2>Express-Generated Page</h2>
      <p><a href="/about">Visit the about route</a></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
